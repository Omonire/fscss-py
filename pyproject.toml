[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fscss"
version = "0.1.0"
description = "Python wrapper for FSCSS (Figured Shorthand CSS) using the vendored Node compiler"
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "FSCSS Python Wrapper" }]
license = { text = "MIT" }
keywords = ["fscss", "css", "preprocessor", "figsh", "xfscss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/fscss-ttr/fscss-py"
Repository = "https://github.com/fscss-ttr/fscss-py"
Issues = "https://github.com/fscss-ttr/fscss-py/issues"

[project.optional-dependencies]
dev = ["pytest", "build", "twine", "ruff", "mypy"]

[project.scripts]
fscss = "fscss.cli:main"

[tool.setuptools]
packages = ["fscss"]
include-package-data = true

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
ignore_missing_imports = true

[tool.setuptools.package-data]
fscss = [
    "_vendor/xfscss/*.js",
    "_vendor/xfscss/*.json",
    "_vendor/xfscss/*.md",
    "_vendor/xfscss/LICENSE",
    "_vendor/xfscss/bin/*.js",
    "_vendor/xfscss/lib/*.js",
    "_vendor/xfscss/lib/functions/*.js",
]
